[package]
name = "maxdown"
version = "1.0.0"
edition = "2024"

# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.102", features = ["std"] }
clap = { version = "4.6.0", features = ["derive"] }
markdown = { version = "1.0.0", features = [], default-features = false }
minijinja = { version = "2.18.0", features = ["debug", "serde"], default-features = false }

[dev-dependencies]
trycmd = "1.1.1"
